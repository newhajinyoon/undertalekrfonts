<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>언더테일/델타룬 한글 폰트 총집합</title>
    <meta name="description" content="언더테일과 델타룬 대사창 한글 패치 폰트(1.08, 팀왈도, 델타룬 등)를 웹에서 미리보기하고 무료로 다운로드할 수 있는 사이트입니다.">
    <style>
        :root {
            --bg: #000;
            --fg: #fff;
            --fg-muted: #888;
            --fg-dim: #ccc;
            --accent-yellow: #ffeb3b;
            --accent-blue: #58a6ff;
            --border: 4px solid var(--fg);
        }

        @font-face { font-family: 'Galmuri9'; src: url('./assets/Galmuri9.ttf') format('truetype'); }
        @font-face { font-family: 'Dialog_Waldo'; src: url('./assets/fonts/DeterminationMonoK2 (팀왈도).ttf') format('truetype'); }
        @font-face { font-family: 'Dialog_108'; src: url('./assets/fonts/GyeoluiChe16.ttf') format('truetype'); }
        @font-face { font-family: 'Menu_Waldo'; src: url('./assets/fonts/DeterminationSansK2 (팀왈도).ttf') format('truetype'); }
        @font-face { font-family: 'Menu_108'; src: url('./assets/fonts/Gyeolui16.ttf') format('truetype'); }
        @font-face { font-family: 'Papyrus_Waldo'; src: url('./assets/fonts/스루피파13 (팀 왈도).ttf') format('truetype'); }
        @font-face { font-family: 'Papyrus_108'; src: url('./assets/fonts/스루피파16 (1.08).ttf') format('truetype'); }
        @font-face { font-family: 'Sans_Common'; src: url('./assets/fonts/즈샌16 (공통).ttf') format('truetype'); }
        @font-face { font-family: 'Bubble_Common'; src: url('./assets/fonts/언텔대사창16 (공통).ttf') format('truetype'); }
        @font-face { font-family: 'Delta_Dotum'; src: url('https://cdn.jsdelivr.net/gh/eocnd1116/qhtjrFont@main/asset/font/DeltaDotumKR.ttf') format('truetype'); }
        @font-face { font-family: 'Delta_Glass'; src: url('https://cdn.jsdelivr.net/gh/eocnd1116/qhtjrFont@main/asset/font/DeltaGlassKR.ttf') format('truetype'); }

        * { box-sizing: border-box; -webkit-font-smoothing: none; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Galmuri9', sans-serif;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        a { color: var(--accent-yellow); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .btn {
            background: var(--bg);
            color: var(--fg);
            border: 2px solid var(--fg);
            padding: 8px 16px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { background: var(--fg); color: var(--bg); text-decoration: none; }

        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 800px;
        }

        .controls { display: flex; flex-direction: column; gap: 16px; }
        .toggle-group { display: flex; border: var(--border); padding: 4px; }
        .toggle-btn {
            flex: 1;
            background: transparent;
            color: var(--fg-muted);
            border: none;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            font-family: inherit;
            position: relative;
        }
        .toggle-btn.active { color: var(--accent-yellow); }
        .toggle-btn.active::before {
            content: "";
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: url('./assets/Undertale_red_soul.svg.png') center/contain no-repeat;
        }

        .dialog {
            border: var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .dialog-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .meta-title { font-size: 20px; margin-bottom: 8px; }
        .meta-info { font-size: 14px; color: var(--fg-muted); line-height: 1.5; }
        .meta-info .font-name { color: var(--fg-dim); margin-right: 6px; }
        .meta-info a { color: var(--accent-blue); }

        .dialog-body { display: flex; gap: 24px; align-items: flex-start; }
        .char-face { width: 110px; height: 110px; object-fit: contain; image-rendering: pixelated; flex-shrink: 0; }
        
        textarea {
            flex: 1;
            background: transparent;
            color: var(--fg);
            border: none;
            outline: none;
            resize: vertical;
            min-height: 160px;
            font-size: 30px;
            line-height: 1.5;
            padding-bottom: 10px;
        }
        textarea::-webkit-scrollbar { width: 0; }

        .dialog-body.bubble-body { gap: 0; }
        .dialog-body.bubble-body .char-face { margin-top: 50px; }
        .bubble {
            flex: 1;
            min-width: 0;
            min-height: 216px;
            display: flex;
            border-style: solid;
            border-color: transparent;
            border-width: 24px;
            border-image-source: url('./assets/Bubble5.svg');
            border-image-slice: 22.22% 24.24% fill;
            border-image-width: 48px;
            border-image-repeat: stretch;
            image-rendering: pixelated;
        }
        .bubble textarea {
            color: #000;
            caret-color: #000;
            min-height: 120px;
            padding: 0 0 0 4px;
            font-size: 30px;
            line-height: 1.4;
        }
        .bubble textarea::selection { background: #000; color: #fff; }

        @keyframes bg-pan-diagonal {
            0% { background-position: 0 0; }
            100% { background-position: -400px 400px; }
        }

        .dialog-body.prophecy-body {
            position: relative;
            height: 330px;
            display: block;
        }
        .prophecy-gif {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            object-fit: contain;
            image-rendering: pixelated;
            z-index: 1;
            pointer-events: none;
        }
        #text-prophecy {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            min-height: unset;
            height: 120px;
            font-size: 32px;
            resize: none;
            
            background-image: url('./assets/depth-text.png');
            background-repeat: repeat;
            background-size: 400px auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            animation: bg-pan-diagonal 8s linear infinite;
            
            caret-color: #fff;
            z-index: 2;
        }

        .icon-info {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 1px solid var(--fg-muted);
            font-size: 10px;
            cursor: help;
            position: relative;
        }
        .icon-info:hover { color: var(--fg); border-color: var(--fg); }
        .icon-info::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--fg);
            color: var(--bg);
            padding: 8px 12px;
            border-radius: 2px;
            font-size: 13px;
            white-space: pre;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .icon-info:hover::after { opacity: 1; }
    </style>

    <script>
        const REL = "https://github.com/newhajinyoon/undertalekrfonts/releases/download/v1/"; 
        const TXT_OLD_KR = "완성형 11,172자 지원 · 한자 지원\n한양PUA(옛한글) 5,299자 지원\n기타 등등";
        
        const fontData = {
            dialog: {
                v108: { name: "GyeoluiChe16.ttf", url: REL + "GyeoluiChe16.ttf", css: "Dialog_108", author: "미니오", link: "https://gall.dcinside.com/mgallery/board/view/?id=undeltarune&no=33114", extra: "(40px 버그 수정 개조됨)", support: "완성형 11,172자 지원", size: "30px", defaultText: "* 당신은 의지로 가득 찼다.\n* 나와 함께 가려는거야?" },
                waldo: { name: "DeterminationMonoK2 (팀왈도).ttf", url: REL + "DeterminationMonoK2.ttf", css: "Dialog_Waldo", author: "미니오", link: "https://gall.dcinside.com/mgallery/board/view/?id=game_nintendo&no=1476022", extra: "(포맷 개조됨)", support: "표준 완성형 2,350자 지원", size: "30px", defaultText: "* 당신은 의지로 가득 찼다.\n* 나와 함께 가려는거야?" },
                deltarune: { name: "DeltaDotumKR.ttf", url: "https://eocnd1116.github.io/qhtjrFont/index.html/raw/main/asset/font/DeltaDotumKR.ttf", css: "Delta_Dotum", author: "qhtjr", link: "https://eocnd1116.github.io/qhtjrFont/index.html", extra: "", support: "완성형 11,172자\n한양PUA(옛한글) 5,299자", size: "40px", defaultText: "* 난 조용한 것들을 보면 화가 치밀어.\n* 나랏말미 귁에 달아" }
            },
            menu: {
                v108: { name: "Gyeolui16.ttf", url: REL + "Gyeolui16.ttf", css: "Menu_108", author: "미니오", link: "https://gall.dcinside.com/mgallery/board/view/?id=undeltarune&no=33114", extra: "(40px 버그 수정 개조됨)", support: "완성형 11,172자 지원", size: "30px" },
                waldo: { name: "DeterminationSansK2 (팀왈도).ttf", url: REL + "DeterminationSansK2.ttf", css: "Menu_Waldo", author: "미니오", link: "https://gall.dcinside.com/mgallery/board/view/?id=game_nintendo&no=1476022", extra: "(포맷 개조됨)", support: "표준 완성형 2,350자 지원", size: "30px" }
            },
            papyrus: {
                v108: { name: "스루피파16 (1.08).ttf", url: REL + "Papyruskr16-1.08.ttf", css: "Papyrus_108", author: "진윤", link: "https://github.com/newhajinyoon/", extra: "", support: TXT_OLD_KR, size: "30px" },
                waldo: { name: "스루피파13 (팀 왈도).ttf", url: REL + "Papyruskr13-teamwaldo.ttf", css: "Papyrus_Waldo", author: "진윤", link: "https://github.com/newhajinyoon/", extra: "", support: TXT_OLD_KR, size: "30px" }
            },
            sans: { name: "즈샌16 (공통).ttf", url: REL + "Sanskr16.ttf", author: "진윤", link: "https://github.com/newhajinyoon/", support: TXT_OLD_KR, size: "30px" },
            bubble: { name: "언텔대사창16 (공통).ttf", url: REL + "UTTextbublekr16.ttf", author: "진윤", link: "https://github.com/newhajinyoon/", support: TXT_OLD_KR, size: "30px" },
            prophecy: { name: "DeltaGlassKR.ttf", url: "https://eocnd1116.github.io/qhtjrFont/index.html/raw/main/asset/font/DeltaGlassKR.ttf", css: "Delta_Glass", author: "qhtjr", link: "https://eocnd1116.github.io/qhtjrFont/index.html", support: "완성형 11,172자 지원\n(초성 제외)", size: "40px" }
        };

        const updateNode = (id, data) => {
            document.getElementById(`name-${id}`).textContent = data.name.replace(/\s*\([^)]*\)/g, '');
            document.getElementById(`info-${id}`).dataset.tooltip = data.support;
            document.getElementById(`text-${id}`).style.fontFamily = data.css;
            document.getElementById(`text-${id}`).style.fontSize = data.size;
            document.getElementById(`dl-${id}`).href = data.url;
            
            const elAuthor = document.getElementById(`author-${id}`);
            elAuthor.textContent = data.author;
            elAuthor.href = data.link;

            const elExtra = document.getElementById(`extra-${id}`);
            if (elExtra) elExtra.textContent = data.extra ? ` ${data.extra}` : "";
        };

        const sfx = document.getElementById('sfx-select');
        const articles = {
            dialog: document.getElementById('article-dialog'),
            menu: document.getElementById('article-menu'),
            papyrus: document.getElementById('article-papyrus'),
            sans: document.getElementById('article-sans'),
            bubble: document.getElementById('article-bubble'),
            prophecy: document.getElementById('article-prophecy')
        };

        window.setVersion = (version, playSound = false) => {
            if (playSound) {
                sfx.currentTime = 0; 
                sfx.play().catch(() => {});
            }

            document.getElementById('btn-108').classList.toggle('active', version === 'v108');
            document.getElementById('btn-waldo').classList.toggle('active', version === 'waldo');
            document.getElementById('btn-deltarune').classList.toggle('active', version === 'deltarune');

            if (version === 'deltarune') {
                articles.menu.style.display = 'none';
                articles.papyrus.style.display = 'none';
                articles.sans.style.display = 'none';
                articles.bubble.style.display = 'none';
                articles.prophecy.style.display = 'flex';
                
                updateNode('dialog', fontData.dialog.deltarune);
                document.getElementById('text-dialog').value = fontData.dialog.deltarune.defaultText;
            } else {
                articles.menu.style.display = 'flex';
                articles.papyrus.style.display = 'flex';
                articles.sans.style.display = 'flex';
                articles.bubble.style.display = 'flex';
                articles.prophecy.style.display = 'none';
                
                updateNode('dialog', fontData.dialog[version]);
                document.getElementById('text-dialog').value = fontData.dialog[version].defaultText;
                
                updateNode('menu', fontData.menu[version]);
                updateNode('papyrus', fontData.papyrus[version]);
            }
        };

        ['sans', 'bubble', 'prophecy'].forEach(id => {
            const d = fontData[id];
            document.getElementById(`name-${id}`).textContent = d.name.replace(/\s*\([^)]*\)/g, '');
            document.getElementById(`info-${id}`).dataset.tooltip = d.support;
            document.getElementById(`author-${id}`).textContent = d.author;
            document.getElementById(`author-${id}`).href = d.link;
            document.getElementById(`text-${id}`).style.fontSize = d.size;
            document.getElementById(`dl-${id}`).href = d.url;
        });

        setVersion('v108', false);
    </script>
